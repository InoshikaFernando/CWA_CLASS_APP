name: CI — Tests

on:
  # `test` only. A push to `main` is a release merge — the identical tree has
  # already run the full matrix on `test`, and re-running it there tested
  # nothing new while costing a second full matrix per release.
  push:
    branches: [test]
  pull_request:
    branches: [main, test]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_ENGINE: sqlite

jobs:
  # Work out which areas a PR actually touched so we only run the relevant app
  # suites instead of all ~20 every time (each job is a fresh runner + full pip
  # install, so running the whole matrix on a one-app change burns Actions
  # minutes for nothing). SAFETY NET: a push to main/test (i.e. a merge / release)
  # ignores the filter and runs EVERY suite, so the promotion gate is always the
  # full test matrix; only PR validation is narrowed. `shared` (project package,
  # requirements, conftest, this workflow) forces the whole matrix even on a PR.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 10   # ~10s
    permissions:
      contents: read
      pull-requests: read
      # skip_ui_matrix looks up whether this tree already passed on the PR.
      actions: read
    outputs:
      # The unit suites this diff needs, as a pytest argument list. One job
      # runs them all: 20 near-identical jobs spent 30s installing deps to run
      # 15s of tests and then billed a whole minute each.
      unit_dirs: ${{ steps.unit.outputs.dirs }}
      # True when the tree this push lands is byte-identical to one a PR run
      # already validated, so the UI matrix would re-run over identical
      # content. Scoped to the UI matrix ONLY — see the step for why the unit
      # suites can never use it.
      #
      # NOT named `ui_*`. ui-matrix builds its group list from every output
      # whose name starts with `ui_`, so an output called `ui_already_tested`
      # became a matrix group called `already_tested` and the run died on
      # `pytest ui_tests/already_tested` (exit 5, no tests collected). It only
      # showed on a push: on a `pull_request` the step is skipped, its output
      # is the empty string, and toJSON drops empty outputs.
      skip_ui_matrix: ${{ steps.tested.outputs.already_tested }}
      # True on a release PR (test -> main). Its tree is byte-identical to
      # what `test` already validated, so re-running the matrix over it
      # proves nothing; release-already-tested checks that instead.
      release: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
      shared: ${{ steps.filter.outputs.shared }}
      classroom: ${{ steps.filter.outputs.classroom }}
      maths: ${{ steps.filter.outputs.maths }}
      quiz: ${{ steps.filter.outputs.quiz }}
      puzzles: ${{ steps.filter.outputs.puzzles }}
      coding: ${{ steps.filter.outputs.coding }}
      accounts: ${{ steps.filter.outputs.accounts }}
      audit: ${{ steps.filter.outputs.audit }}
      billing: ${{ steps.filter.outputs.billing }}
      homework: ${{ steps.filter.outputs.homework }}
      brainbuzz: ${{ steps.filter.outputs.brainbuzz }}
      ai_import: ${{ steps.filter.outputs.ai_import }}
      worksheets: ${{ steps.filter.outputs.worksheets }}
      taskqueue: ${{ steps.filter.outputs.taskqueue }}
      feedback: ${{ steps.filter.outputs.feedback }}
      sprints: ${{ steps.filter.outputs.sprints }}
      whatsapp: ${{ steps.filter.outputs.whatsapp }}
      ops: ${{ steps.filter.outputs.ops }}
      notifications: ${{ steps.filter.outputs.notifications }}
      progress: ${{ steps.filter.outputs.progress }}
      usage: ${{ steps.filter.outputs.usage }}
      rewards: ${{ steps.filter.outputs.rewards }}
      ui_core: ${{ steps.filter.outputs.ui_core }}
      ui_billing: ${{ steps.filter.outputs.ui_billing }}
      ui_brainbuzz: ${{ steps.filter.outputs.ui_brainbuzz }}
      ui_classroom: ${{ steps.filter.outputs.ui_classroom }}
      ui_coding: ${{ steps.filter.outputs.ui_coding }}
      ui_feedback: ${{ steps.filter.outputs.ui_feedback }}
      ui_homework: ${{ steps.filter.outputs.ui_homework }}
      ui_live: ${{ steps.filter.outputs.ui_live }}
      ui_maths: ${{ steps.filter.outputs.ui_maths }}
      ui_messaging: ${{ steps.filter.outputs.ui_messaging }}
      ui_navigation: ${{ steps.filter.outputs.ui_navigation }}
      ui_parent: ${{ steps.filter.outputs.ui_parent }}
      ui_progress: ${{ steps.filter.outputs.ui_progress }}
      ui_quiz: ${{ steps.filter.outputs.ui_quiz }}
      ui_uploads: ${{ steps.filter.outputs.ui_uploads }}
      ui_worksheets: ${{ steps.filter.outputs.ui_worksheets }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'cwa_classroom/requirements-test.txt'
              - 'cwa_classroom/requirements.txt'
              - 'cwa_classroom/cwa_classroom/**'
              - 'cwa_classroom/conftest.py'
              - 'cwa_classroom/pytest.ini'
              - 'cwa_classroom/manage.py'
              - '.github/workflows/ci.yml'
            classroom:
              - 'cwa_classroom/classroom/**'
            maths:
              - 'cwa_classroom/maths/**'
              # maths.Question's manager lives in brainbuzz — a change there
              # (e.g. the visibility filters) can break maths without touching
              # a single file under maths/.
              - 'cwa_classroom/brainbuzz/managers.py'
            quiz:
              - 'cwa_classroom/quiz/**'
            puzzles:
              - 'cwa_classroom/number_puzzles/**'
            coding:
              - 'cwa_classroom/coding/**'
              # Same for CodingExercise's manager.
              - 'cwa_classroom/brainbuzz/managers.py'
            accounts:
              - 'cwa_classroom/accounts/**'
            audit:
              - 'cwa_classroom/audit/**'
            billing:
              - 'cwa_classroom/billing/**'
            homework:
              - 'cwa_classroom/homework/**'
            brainbuzz:
              - 'cwa_classroom/brainbuzz/**'
            ai_import:
              - 'cwa_classroom/ai_import/**'
            worksheets:
              - 'cwa_classroom/worksheets/**'
            taskqueue:
              - 'cwa_classroom/taskqueue/**'
            feedback:
              - 'cwa_classroom/feedback/**'
            sprints:
              - 'cwa_classroom/sprints/**'
            whatsapp:
              - 'cwa_classroom/whatsapp/**'
            ops:
              - 'cwa_classroom/ops/**'
            notifications:
              - 'cwa_classroom/notifications/**'
            progress:
              - 'cwa_classroom/progress/**'
              # The period report reads homework submissions, worksheet results
              # and class membership — a change in any of those can break the
              # report without touching a file under progress/.
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/worksheets/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/classroom/models.py'
              # The sidebar visibility flag for period reports is set here, and
              # its tests assert on it.
              - 'cwa_classroom/accounts/context_processors.py'
            usage:
              - 'cwa_classroom/usage/**'
            rewards:
              - 'cwa_classroom/rewards/**'
              # The ledger's tests drive the real award site in every app that
              # gives a student points. A change in any of them can stop that
              # activity crediting the leaderboard without touching a file under
              # rewards/ — which would show as a board that quietly stops
              # moving, not as a failure. Watch them all.
              - 'cwa_classroom/quiz/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/coding/**'
              - 'cwa_classroom/worksheets/**'
              - 'cwa_classroom/number_puzzles/**'
              - 'cwa_classroom/brainbuzz/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/templates/hub/**'
            # ---- UI (Playwright) --------------------------------------------
            # One filter per ui_tests/<group>/ package. The names MUST stay in
            # lockstep with the directories on disk — tests_workflows.py fails
            # the build if a group has no filter (its tests would silently stop
            # running) or a filter has no group.
            #
            # `ui_core` is the cross-cutting escape hatch: shared UI fixtures,
            # the base templates/sidebars every page inherits, and all static
            # assets. Anything here can break any page, so it runs EVERY group.
            ui_core:
              - 'cwa_classroom/ui_tests/*.py'
              - 'cwa_classroom/templates/base*.html'
              # partials/ is the genuinely global set — topbar, toasts, modals,
              # pagination, breadcrumbs, the role-sidebar dispatcher. Every page
              # inherits them, so a change here runs the whole matrix rather
              # than being second-guessed file by file.
              - 'cwa_classroom/templates/partials/**'
              - 'cwa_classroom/static/**'
              - 'cwa_classroom/**/static/**'
            ui_billing:
              - 'cwa_classroom/ui_tests/billing/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/attendance/**'
              - 'cwa_classroom/billing/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/templates/billing/**'
              - 'cwa_classroom/templates/invoicing/**'
              - 'cwa_classroom/templates/accounting/**'
              - 'cwa_classroom/templates/reports/**'
            ui_brainbuzz:
              - 'cwa_classroom/ui_tests/brainbuzz/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/brainbuzz/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/templates/brainbuzz/**'
            ui_classroom:
              - 'cwa_classroom/ui_tests/classroom/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/attendance/**'
              - 'cwa_classroom/billing/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/templates/admin_dashboard/**'
              - 'cwa_classroom/templates/hierarchy/**'
              - 'cwa_classroom/templates/hod/**'
              - 'cwa_classroom/templates/progress/**'
              - 'cwa_classroom/templates/reports/**'
              - 'cwa_classroom/templates/student/**'
              - 'cwa_classroom/templates/teacher/**'
            ui_coding:
              - 'cwa_classroom/ui_tests/coding/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/coding/**'
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/templates/coding/**'
            ui_feedback:
              - 'cwa_classroom/ui_tests/feedback/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/feedback/**'
              - 'cwa_classroom/templates/feedback/**'
            ui_homework:
              - 'cwa_classroom/ui_tests/homework/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/templates/homework/**'
            # Deployed-environment tests (-m migration / -m live). They skip
            # without --live-url, so the job only proves they still import and
            # collect — cheap, and the alternative is finding a broken live
            # test during a release.
            ui_live:
              - 'cwa_classroom/ui_tests/live/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/ai_import/**'
              - 'cwa_classroom/brainbuzz/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/coding/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/number_puzzles/**'
              - 'cwa_classroom/quiz/**'
              - 'cwa_classroom/ui_tests/live_helpers.py'
            ui_maths:
              - 'cwa_classroom/ui_tests/maths/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/templates/maths/**'
              # The interactive question types are exercised through the homework
              # take page, so its partials decide whether a maths widget renders
              # at all — a change there can break every test in this group
              # without touching templates/maths/.
              - 'cwa_classroom/templates/homework/**'
            # The sidebars link into every subject app, so a change to any of
            # them can break a nav test. Broad on purpose.
            ui_messaging:
              - 'cwa_classroom/ui_tests/messaging/**'
              - 'cwa_classroom/accounts/**'
              # The Messaging Centre lives inside the classroom app
              # (views_messaging.py, send_due_messages, email_service), so a
              # change there is what most often breaks these tests.
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/templates/messaging/**'
            ui_navigation:
              - 'cwa_classroom/ui_tests/navigation/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/rewards/**'
              - 'cwa_classroom/ai_import/**'
              - 'cwa_classroom/billing/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/coding/**'
              - 'cwa_classroom/help/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/music/**'
              - 'cwa_classroom/number_puzzles/**'
              - 'cwa_classroom/quiz/**'
              - 'cwa_classroom/science/**'
              - 'cwa_classroom/worksheets/**'
              - 'cwa_classroom/templates/accounts/**'
              - 'cwa_classroom/templates/hub/**'
              - 'cwa_classroom/templates/registration/**'
            ui_parent:
              - 'cwa_classroom/ui_tests/parent/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/number_puzzles/**'
              - 'cwa_classroom/templates/parent/**'
            ui_progress:
              - 'cwa_classroom/ui_tests/progress/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/homework/**'
              # Quizzes, times tables and basic facts are read straight off
              # maths models, so a change there can break a report.
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/progress/**'
              - 'cwa_classroom/worksheets/**'
              - 'cwa_classroom/templates/progress/**'
            ui_quiz:
              - 'cwa_classroom/ui_tests/quiz/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/quiz/**'
              - 'cwa_classroom/templates/quiz/**'
              - 'cwa_classroom/templates/base_quiz.html'
            # Question/content import: /upload-questions/ (classroom views),
            # the PDF import pipeline (ai_import), and the homework + worksheet
            # upload forms that share the page-range field.
            ui_uploads:
              - 'cwa_classroom/ui_tests/uploads/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/ai_import/**'
              - 'cwa_classroom/billing/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/quiz/**'
              - 'cwa_classroom/worksheets/**'
              # "Preview as student" on the review page builds a maths.Question
              # and renders the student take partial, so a change to either
              # breaks the upload screens without touching an upload app.
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/templates/homework/**'
              - 'cwa_classroom/templates/ai_import/**'
              - 'cwa_classroom/templates/_partials/**'
              - 'cwa_classroom/ui_tests/xls_fixtures.py'
            ui_worksheets:
              - 'cwa_classroom/ui_tests/worksheets/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/billing/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/taskqueue/**'
              - 'cwa_classroom/worksheets/**'
              - 'cwa_classroom/templates/worksheets/**'
              # The session page renders the shared maths widgets (the table of
              # values, the fill-in-the-blank sentence) and the partial-credit
              # feedback block, so a change there breaks a worksheet test
              # without touching templates/worksheets/.
              - 'cwa_classroom/templates/maths/**'

      # ---- Which unit suites does this diff need? ---------------------------
      #
      # These used to be 20 separate jobs, one per app, each doing checkout +
      # setup-python + `pip install -r requirements-test.txt` before running
      # its suite. Measured on a full run: 22 unit jobs cost 44 billed minutes
      # to run 21.7 minutes of tests. Notifications billed a full minute for
      # six seconds of tests.
      #
      # Two thirds of that was setup repeated 20 times and GitHub rounding
      # every job up to a whole minute, so they are now ONE job — but with a
      # target list built from the same path filters, not a fixed group. A
      # fixed group would make the common case worse: an accounts-only PR runs
      # `pytest accounts/` for ~2 billed minutes today, and would pay for all
      # 20 suites instead. Deriving the list keeps that PR at ~2 and takes the
      # full run from 32 billed minutes to ~12.
      #
      # `classroom` is deliberately NOT here. At 11 of the 21.7 test-minutes it
      # is the long pole, and keeping its own job lets it run beside this one
      # instead of in front of it — merging it would double the wall clock.
      - name: Which unit suites does this diff need?
        id: unit
        env:
          # filter key -> pytest target. Data rather than shell so
          # tests_workflows.py can check the same map the job runs on: a suite
          # dropped from here would stop running everywhere, silently.
          UNIT_SUITES: |
            accounts:accounts/
            ai_import:ai_import/
            audit:audit/
            billing:billing/
            brainbuzz:brainbuzz/
            coding:coding/
            feedback:feedback/
            homework:homework/
            maths:maths/
            notifications:notifications/
            ops:ops/
            progress:progress/
            puzzles:number_puzzles/
            quiz:quiz/
            rewards:rewards/
            sprints:sprints/
            taskqueue:taskqueue/
            usage:usage/
            whatsapp:whatsapp/
            worksheets:worksheets/
          # The project package's own tests have no filter of their own — they
          # ran on `shared` when this was the health-tests job, and `shared` is
          # one of the two things inside RUN_ALL.
          UNIT_SHARED_ONLY: cwa_classroom/tests.py
          CHANGED: ${{ toJSON(steps.filter.outputs) }}
          # The safety net the per-app jobs used to carry in their own `if:`.
          # A merge to `test` is the promotion gate and runs EVERY unit suite:
          # they are the cheap half and the half that catches one app breaking
          # another, which a PR narrowed to the changed app cannot see.
          RUN_ALL: ${{ github.event_name == 'push' || steps.filter.outputs.shared == 'true' }}
        run: |
          set -euo pipefail
          dirs=""
          while IFS=: read -r key target; do
            [ -n "$key" ] || continue
            if [ "$RUN_ALL" = "true" ] \
               || [ "$(jq -r --arg k "$key" '.[$k] // "false"' <<<"$CHANGED")" = "true" ]; then
              dirs="$dirs $target"
            fi
          done <<<"$UNIT_SUITES"
          if [ "$RUN_ALL" = "true" ]; then
            dirs="$dirs $UNIT_SHARED_ONLY"
          fi
          dirs=$(echo $dirs)
          # An empty list makes the job vanish, which reads the same as a CI
          # that has quietly stopped running — say which it was.
          if [ -z "$dirs" ]; then
            echo "No unit suites needed for this diff."
          else
            echo "Unit suites selected: $dirs"
          fi
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

      # ---- Has this exact tree already been through the UI matrix? ----------
      #
      # A `pull_request` run does NOT test the PR head — it tests
      # `refs/pull/N/merge`, i.e. the PR merged into its base. So when a merge
      # to `test` lands a tree the PR run already had, the push re-runs the UI
      # groups over byte-identical content. Roughly half of merges here are in
      # that position (the PR branch was up to date with `test`), and the UI
      # matrix is ~60 of the ~105 billed minutes a full run costs.
      #
      # THIS IS FOR THE UI MATRIX ONLY. The unit suites are unfiltered on a
      # push precisely because a PR run is narrowed to the apps it touched —
      # that push is what catches one app breaking another, and skipping it
      # against a narrowed PR run would delete exactly that signal. The UI
      # matrix is different: it is path-filtered identically on both events
      # (since 2026-08-24), so for one tree the two runs select the same
      # groups and the second proves nothing.
      #
      # The claim is only made when all four hold, so the PR really did run
      # this content through the same groups:
      #
      #   1. the push is a two-parent merge commit — parents [base, head];
      #   2. tree(merge) == tree(head): the merge brought in nothing new, so
      #      what lands IS what the PR branch held;
      #   3. base is an ancestor of head: the PR was up to date with `test`,
      #      so `refs/pull/N/merge` reduced to the head commit itself and the
      #      PR therefore tested this tree — and the PR's path filter ran
      #      against a base no newer than this one, so it selected these
      #      groups or a superset of them;
      #   4. a `pull_request` CI run on that head SHA actually concluded
      #      success.
      #
      # Any doubt resolves to running the matrix — every path out of this step
      # except the last one is `false`.
      - name: Has this tree already passed the UI matrix?
        id: tested
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/test' }}
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = (why) => {
              core.info(`Running the UI matrix: ${why}`);
              core.setOutput('already_tested', 'false');
            };

            const { data: merge } = await github.rest.git.getCommit({
              owner, repo, commit_sha: context.sha,
            });
            if (merge.parents.length !== 2) {
              return run(`${context.sha.slice(0, 8)} is not a two-parent merge`);
            }
            const [base, head] = merge.parents.map((p) => p.sha);

            const { data: headCommit } = await github.rest.git.getCommit({
              owner, repo, commit_sha: head,
            });
            if (headCommit.tree.sha !== merge.tree.sha) {
              return run(
                `the merge of ${head.slice(0, 8)} changed the tree, so this ` +
                `content has not been tested as a whole`);
            }

            const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${base}...${head}`,
            });
            if (!['ahead', 'identical'].includes(cmp.status)) {
              return run(
                `${head.slice(0, 8)} was not up to date with test ` +
                `(${cmp.status}), so the PR tested a different merge`);
            }

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', head_sha: head,
              event: 'pull_request',
            });
            const passed = runs.workflow_runs.find(
              (r) => r.conclusion === 'success');
            if (!passed) {
              return run(`no successful PR run for ${head.slice(0, 8)}`);
            }

            core.info(
              `Tree ${merge.tree.sha.slice(0, 8)} already passed in PR run ` +
              `#${passed.run_number} (${passed.html_url}) — skipping the UI ` +
              `matrix. Unit suites still run in full.`);
            core.setOutput('already_tested', 'true');

  # Always runs — missing/conflicting migrations must never slip through, and the
  # check is cheap. Not gated on `changes`.
  migration-check:
    name: Migration Health
    runs-on: ubuntu-latest
    timeout-minutes: 20   # ~2min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Check for migration conflicts and missing migrations
        working-directory: cwa_classroom
        run: pytest tests_migrations.py -v --tb=short

      # Runs here because this job is the only one that is never path-gated.
      # An invalid workflow file does not go red — GitHub kills the run in zero
      # seconds and PRs show no checks at all — so it has to be caught by a
      # test rather than by noticing the absence of one.
      - name: Validate the GitHub Actions workflow files
        working-directory: cwa_classroom
        run: pytest tests_workflows.py -v --tb=short

  # A release PR (test -> main) merges `test` into `main` unchanged, so its tree
  # is byte-identical to the one the full matrix just ran on `test`. Re-running
  # every suite over it proved nothing and cost a second full matrix per
  # release — which is how the Actions spending limit was reached mid-release.
  #
  # It is NOT simply skipped: a PR showing no checks at all is how a dead CI
  # went unnoticed here for four days. This asserts the claim the skip relies
  # on — that this exact commit already passed CI on `test`.
  release-already-tested:
    name: Release tree already tested on test
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5   # instant
    permissions:
      actions: read
      contents: read
    steps:
      # v8+ runs on Node 24. v7 is a Node 20 action, and the runners now warn
      # that Node 20 is deprecated — a warning on every release PR would teach
      # people to ignore this job's output, which is the one thing it exists to
      # be read for.
      - uses: actions/github-script@v8
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'test',
              head_sha: sha,
              event: 'push',
            });
            const found = runs.data.workflow_runs;
            const passed = found.find(r => r.conclusion === 'success');
            if (passed) {
              core.info(`CI run #${passed.run_number} passed on test for ${sha}`);
              core.info(passed.html_url);
              return;
            }
            const running = found.find(r => r.status !== 'completed');
            if (running) {
              // Name the run rather than showing a bare red tick — nothing is
              // wrong, it simply has not finished, and re-running THIS job is
              // the fix.
              core.setFailed(
                `CI on test is still running for ${sha} ` +
                `(run #${running.run_number}: ${running.html_url}). ` +
                `Re-run this check once it finishes.`);
              return;
            }
            core.setFailed(
              `No successful CI run on test for ${sha}. ` +
              `This tree has not been validated — do not merge to main.`);

  classroom-tests:
    name: Classroom Tests
    needs: changes
    if: ${{ needs.changes.outputs.release != 'true' && (github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.classroom == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45   # ~20min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run classroom tests
        working-directory: cwa_classroom
        run: pytest classroom/ -n auto --dist=loadscope -v --tb=short

  # One job for every app suite except classroom, with its targets chosen by
  # the `changes` job. See the "Which unit suites does this diff need?" step
  # there for the measurements and for why classroom is not in it.
  #
  # KEEP THE NAME STABLE. The per-app checks ("Billing Tests", "Accounts
  # Tests", …) are gone, so branch protection for `test` and `main` must
  # require this one instead — a required check that no longer exists blocks
  # every PR forever.
  unit-tests:
    name: Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.release != 'true' && needs.changes.outputs.unit_dirs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40   # ~8min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run unit suites
        working-directory: cwa_classroom
        env:
          DIRS: ${{ needs.changes.outputs.unit_dirs }}
        # Unquoted on purpose — DIRS is a pytest argument LIST, and the values
        # are fixed in ci.yml rather than coming from the diff.
        run: pytest $DIRS -n auto --dist=loadscope -v --tb=short


  # ── UI (Playwright) ──────────────────────────────────────────────────────
  # The UI suite is by far the most expensive thing in CI (~33 min as one job),
  # so it is split into per-app-area packages under cwa_classroom/ui_tests/ and
  # only the areas a change actually touches get a runner.
  #
  #   PR            → the groups whose paths changed, in full. A PR that touches
  #                   no UI-relevant path runs no UI job at all; one that touches
  #                   `ui_core` or `shared` (base templates, sidebars, static,
  #                   shared fixtures) runs every group, because those can break
  #                   any page.
  #   push to test  → the same path filter, against the previous `test` tip, so
  #                   the merge runs the groups it actually brought in. The
  #                   `ui_core` / `shared` escape still forces every group.
  #   push to main  → nothing. That tree already passed the full suite on `test`;
  #                   re-running it here is pure waste.
  #
  # WHY THE PUSH IS FILTERED TOO (changed 2026-08-24)
  # -------------------------------------------------
  # It used to run all 15 groups on every push to `test`, unfiltered, as the
  # pre-production gate. That is 67 of the ~120 billed minutes a full matrix
  # costs, on every merge — and the UI groups are not slow, they are large
  # (classroom 231 tests, billing 233, navigation 223), so there is no fat to
  # trim inside them. The only lever is running the ones a change can affect.
  #
  # At ~8 merges a day that unfiltered gate was ~$5.75/day of a ~$16.50/day
  # bill, and on 2026-08-24 the account hit its Actions spending limit: every
  # workflow in the repository, including the production deploy, began dying in
  # two seconds with no logs.
  #
  # The unit suites are deliberately NOT filtered on a push (see
  # test_ci_still_runs_every_suite_on_a_push) — they are cheap and they are
  # what catches a change in one app breaking another. What this gives up is
  # narrower: a UI regression in an area whose paths the merge did not touch is
  # caught at the release PR rather than at the merge.
  #
  # Groups run as a dynamic matrix, so they execute in parallel — a full run is
  # now bounded by the slowest single group rather than the sum of all of them.
  ui-matrix:
    name: Select UI suites
    needs: changes
    if: ${{ needs.changes.outputs.release != 'true' && needs.changes.outputs.skip_ui_matrix != 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/test')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10   # instant
    outputs:
      groups: ${{ steps.pick.outputs.groups }}
    steps:
      - name: Pick the UI groups to run
        id: pick
        env:
          # Every `ui_*` filter result, as JSON. The group list is derived from
          # these keys, so ci.yml stays the single source of truth for which
          # groups exist (tests_workflows.py checks it against the directories).
          CHANGED: ${{ toJSON(needs.changes.outputs) }}
          # No `push` arm: a merge to `test` runs the groups its own diff
          # touches, exactly as a PR does. `shared` / `ui_core` still force
          # every group on either event, because those can break any page.
          RUN_ALL: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.ui_core == 'true' }}
        run: |
          set -euo pipefail
          all=$(jq -c '[to_entries[]
                        | select(.key | startswith("ui_"))
                        | select(.key != "ui_core")
                        | (.key | sub("^ui_"; ""))] | sort' <<<"$CHANGED")
          if [ "$RUN_ALL" = "true" ]; then
            groups="$all"
            echo "Running the full UI matrix (push, or a shared/ui_core change)."
          else
            groups=$(jq -c '[to_entries[]
                             | select(.key | startswith("ui_"))
                             | select(.key != "ui_core")
                             | select(.value == "true")
                             | (.key | sub("^ui_"; ""))] | sort' <<<"$CHANGED")
          fi
          # An empty matrix would make the ui-tests job vanish with no signal at
          # all, so say out loud that nothing UI-related changed.
          if [ "$groups" = "[]" ]; then
            echo "No UI-relevant paths changed — skipping the UI suite."
          else
            echo "UI groups selected: $groups (of $all)"
          fi
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  # Skipping is not the same as not checking: a push showing no UI check at all
  # is how a dead CI went unnoticed here for four days. When the matrix is
  # deduped this job says so, and names the PR run that covered the tree, so the
  # claim is readable rather than implied by an absent job.
  ui-already-tested:
    name: UI matrix already ran for this tree
    needs: changes
    if: ${{ needs.changes.outputs.skip_ui_matrix == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5   # instant
    steps:
      - name: Report which run covered it
        run: |
          echo "This push lands a tree a pull_request run already took through"
          echo "the UI matrix — see 'Detect changed areas' for the run number"
          echo "and the four conditions that were checked."
          echo
          echo "The unit suites are NOT deduped and ran in full on this push."

  ui-tests:
    name: UI Tests (${{ matrix.group }})
    needs: ui-matrix
    if: ${{ needs.ui-matrix.outputs.groups != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35   # ~11min
    strategy:
      # One broken area must not cancel the others — a full run should report
      # every failing group, not just the first.
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.ui-matrix.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('cwa_classroom/requirements-test.txt') }}

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run UI tests — ${{ matrix.group }}
        working-directory: cwa_classroom
        env:
          # `-n auto` is one worker per CPU, and a PRIVATE repo's runner has
          # TWO — so each group still ran two browsers at a time. These tests
          # are I/O-bound (waiting on the browser, not computing), so more
          # workers than cores is the right call and cuts each group's wall
          # clock and billed minutes together. Raise further only with
          # evidence: the ceiling is the SQLite contention --reruns absorbs.
          UI_WORKERS: 4
        # --reruns retries ONLY the known SQLite "database is locked" flake from
        # parallel Playwright workers (see cwa_classroom/conftest.py); scoped via
        # --only-rerun so genuine assertion failures still fail on the first run.
        run: |
          pytest "ui_tests/${{ matrix.group }}" -n "$UI_WORKERS" -v --tb=short \
            --reruns 2 --only-rerun "database is locked"

  # Branch protection needs ONE check name that never moves. The matrix jobs are
  # called "UI Tests (billing)", "UI Tests (classroom)", … and that set changes
  # whenever a group is added, so a required check pointing at any of them (or
  # at the old single "UI Tests (Playwright)" job) would either block forever or
  # silently stop gating. This job keeps that name, always runs, and is red iff
  # the UI suite is red.
  #
  # KEEP THE NAME STABLE. Point branch protection for `test` and `main` here.
  ui-tests-gate:
    name: UI Tests (Playwright)
    needs: [changes, ui-matrix, ui-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5   # instant
    steps:
      - name: Report the UI suite result
        env:
          CHANGES: ${{ needs.changes.result }}
          MATRIX: ${{ needs.ui-matrix.result }}
          TESTS: ${{ needs.ui-tests.result }}
          GROUPS: ${{ needs.ui-matrix.outputs.groups }}
          ALREADY_TESTED: ${{ needs.changes.outputs.skip_ui_matrix }}
        run: |
          set -euo pipefail
          echo "changes:   $CHANGES"
          echo "ui-matrix: $MATRIX"
          echo "ui-tests:  $TESTS"
          echo "groups:    ${GROUPS:-(none)}"

          # `changes` has no if:, so it always runs. If it did not succeed, the
          # jobs below it were skipped for want of a filter result, not because
          # there was nothing to do — that must not read as green.
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Path filtering failed ($CHANGES); UI coverage is unknown"
            exit 1
          fi

          # ui-matrix skips on a push to main, where the UI suite is
          # deliberately not run — that is a pass, not a gap.
          case "$MATRIX" in
            success|skipped) ;;
            *)
              echo "::error::Could not determine which UI suites to run ($MATRIX)"
              exit 1
              ;;
          esac

          # skipped = no UI-relevant paths changed, or the whole suite was not
          # scheduled for this event. Anything other than that or success means
          # a group failed, was cancelled, or never reported.
          case "$TESTS" in
            success)
              echo "UI suite green for: ${GROUPS:-(none)}"
              ;;
            skipped)
              # Three different reasons land here, and "nothing changed" is the
              # only one that is self-evident. Say which it was.
              if [ "$ALREADY_TESTED" = "true" ]; then
                echo "UI matrix already ran for this tree on the PR — see the"
                echo "'UI matrix already ran for this tree' check."
              else
                echo "No UI suites needed to run."
              fi
              ;;
            *)
              echo "::error::UI suite did not pass ($TESTS)"
              exit 1
              ;;
          esac
