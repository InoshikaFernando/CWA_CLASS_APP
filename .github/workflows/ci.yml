name: CI — Tests

on:
  # `test` only. A push to `main` is a release merge — the identical tree has
  # already run the full matrix on `test`, and re-running it there tested
  # nothing new while costing a second full matrix per release.
  push:
    branches: [test]
  pull_request:
    branches: [main, test]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_ENGINE: sqlite

jobs:
  # Work out which areas a PR actually touched so we only run the relevant app
  # suites instead of all ~20 every time (each job is a fresh runner + full pip
  # install, so running the whole matrix on a one-app change burns Actions
  # minutes for nothing). SAFETY NET: a push to main/test (i.e. a merge / release)
  # ignores the filter and runs EVERY suite, so the promotion gate is always the
  # full test matrix; only PR validation is narrowed. `shared` (project package,
  # requirements, conftest, this workflow) forces the whole matrix even on a PR.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # True on a release PR (test -> main). Its tree is byte-identical to
      # what `test` already validated, so re-running the matrix over it
      # proves nothing; release-already-tested checks that instead.
      release: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
      shared: ${{ steps.filter.outputs.shared }}
      classroom: ${{ steps.filter.outputs.classroom }}
      maths: ${{ steps.filter.outputs.maths }}
      quiz: ${{ steps.filter.outputs.quiz }}
      puzzles: ${{ steps.filter.outputs.puzzles }}
      coding: ${{ steps.filter.outputs.coding }}
      accounts: ${{ steps.filter.outputs.accounts }}
      audit: ${{ steps.filter.outputs.audit }}
      billing: ${{ steps.filter.outputs.billing }}
      homework: ${{ steps.filter.outputs.homework }}
      brainbuzz: ${{ steps.filter.outputs.brainbuzz }}
      ai_import: ${{ steps.filter.outputs.ai_import }}
      worksheets: ${{ steps.filter.outputs.worksheets }}
      taskqueue: ${{ steps.filter.outputs.taskqueue }}
      feedback: ${{ steps.filter.outputs.feedback }}
      sprints: ${{ steps.filter.outputs.sprints }}
      whatsapp: ${{ steps.filter.outputs.whatsapp }}
      ops: ${{ steps.filter.outputs.ops }}
      notifications: ${{ steps.filter.outputs.notifications }}
      progress: ${{ steps.filter.outputs.progress }}
      usage: ${{ steps.filter.outputs.usage }}
      rewards: ${{ steps.filter.outputs.rewards }}
      ui_core: ${{ steps.filter.outputs.ui_core }}
      ui_billing: ${{ steps.filter.outputs.ui_billing }}
      ui_brainbuzz: ${{ steps.filter.outputs.ui_brainbuzz }}
      ui_classroom: ${{ steps.filter.outputs.ui_classroom }}
      ui_coding: ${{ steps.filter.outputs.ui_coding }}
      ui_feedback: ${{ steps.filter.outputs.ui_feedback }}
      ui_homework: ${{ steps.filter.outputs.ui_homework }}
      ui_live: ${{ steps.filter.outputs.ui_live }}
      ui_maths: ${{ steps.filter.outputs.ui_maths }}
      ui_navigation: ${{ steps.filter.outputs.ui_navigation }}
      ui_parent: ${{ steps.filter.outputs.ui_parent }}
      ui_progress: ${{ steps.filter.outputs.ui_progress }}
      ui_quiz: ${{ steps.filter.outputs.ui_quiz }}
      ui_uploads: ${{ steps.filter.outputs.ui_uploads }}
      ui_worksheets: ${{ steps.filter.outputs.ui_worksheets }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'cwa_classroom/requirements-test.txt'
              - 'cwa_classroom/requirements.txt'
              - 'cwa_classroom/cwa_classroom/**'
              - 'cwa_classroom/conftest.py'
              - 'cwa_classroom/pytest.ini'
              - 'cwa_classroom/manage.py'
              - '.github/workflows/ci.yml'
            classroom:
              - 'cwa_classroom/classroom/**'
            maths:
              - 'cwa_classroom/maths/**'
              # maths.Question's manager lives in brainbuzz — a change there
              # (e.g. the visibility filters) can break maths without touching
              # a single file under maths/.
              - 'cwa_classroom/brainbuzz/managers.py'
            quiz:
              - 'cwa_classroom/quiz/**'
            puzzles:
              - 'cwa_classroom/number_puzzles/**'
            coding:
              - 'cwa_classroom/coding/**'
              # Same for CodingExercise's manager.
              - 'cwa_classroom/brainbuzz/managers.py'
            accounts:
              - 'cwa_classroom/accounts/**'
            audit:
              - 'cwa_classroom/audit/**'
            billing:
              - 'cwa_classroom/billing/**'
            homework:
              - 'cwa_classroom/homework/**'
            brainbuzz:
              - 'cwa_classroom/brainbuzz/**'
            ai_import:
              - 'cwa_classroom/ai_import/**'
            worksheets:
              - 'cwa_classroom/worksheets/**'
            taskqueue:
              - 'cwa_classroom/taskqueue/**'
            feedback:
              - 'cwa_classroom/feedback/**'
            sprints:
              - 'cwa_classroom/sprints/**'
            whatsapp:
              - 'cwa_classroom/whatsapp/**'
            ops:
              - 'cwa_classroom/ops/**'
            notifications:
              - 'cwa_classroom/notifications/**'
            progress:
              - 'cwa_classroom/progress/**'
              # The period report reads homework submissions, worksheet results
              # and class membership — a change in any of those can break the
              # report without touching a file under progress/.
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/worksheets/**'
              - 'cwa_classroom/classroom/models.py'
            usage:
              - 'cwa_classroom/usage/**'
            rewards:
              - 'cwa_classroom/rewards/**'
              # The ledger's tests drive the real award site in every app that
              # gives a student points. A change in any of them can stop that
              # activity crediting the leaderboard without touching a file under
              # rewards/ — which would show as a board that quietly stops
              # moving, not as a failure. Watch them all.
              - 'cwa_classroom/quiz/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/coding/**'
              - 'cwa_classroom/worksheets/**'
              - 'cwa_classroom/number_puzzles/**'
              - 'cwa_classroom/brainbuzz/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/templates/hub/**'
            # ---- UI (Playwright) --------------------------------------------
            # One filter per ui_tests/<group>/ package. The names MUST stay in
            # lockstep with the directories on disk — tests_workflows.py fails
            # the build if a group has no filter (its tests would silently stop
            # running) or a filter has no group.
            #
            # `ui_core` is the cross-cutting escape hatch: shared UI fixtures,
            # the base templates/sidebars every page inherits, and all static
            # assets. Anything here can break any page, so it runs EVERY group.
            ui_core:
              - 'cwa_classroom/ui_tests/*.py'
              - 'cwa_classroom/templates/base*.html'
              # partials/ is the genuinely global set — topbar, toasts, modals,
              # pagination, breadcrumbs, the role-sidebar dispatcher. Every page
              # inherits them, so a change here runs the whole matrix rather
              # than being second-guessed file by file.
              - 'cwa_classroom/templates/partials/**'
              - 'cwa_classroom/static/**'
              - 'cwa_classroom/**/static/**'
            ui_billing:
              - 'cwa_classroom/ui_tests/billing/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/attendance/**'
              - 'cwa_classroom/billing/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/templates/billing/**'
              - 'cwa_classroom/templates/invoicing/**'
              - 'cwa_classroom/templates/accounting/**'
              - 'cwa_classroom/templates/reports/**'
            ui_brainbuzz:
              - 'cwa_classroom/ui_tests/brainbuzz/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/brainbuzz/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/templates/brainbuzz/**'
            ui_classroom:
              - 'cwa_classroom/ui_tests/classroom/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/attendance/**'
              - 'cwa_classroom/billing/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/templates/admin_dashboard/**'
              - 'cwa_classroom/templates/hierarchy/**'
              - 'cwa_classroom/templates/hod/**'
              - 'cwa_classroom/templates/progress/**'
              - 'cwa_classroom/templates/reports/**'
              - 'cwa_classroom/templates/student/**'
              - 'cwa_classroom/templates/teacher/**'
            ui_coding:
              - 'cwa_classroom/ui_tests/coding/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/coding/**'
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/templates/coding/**'
            ui_feedback:
              - 'cwa_classroom/ui_tests/feedback/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/feedback/**'
              - 'cwa_classroom/templates/feedback/**'
            ui_homework:
              - 'cwa_classroom/ui_tests/homework/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/templates/homework/**'
            # Deployed-environment tests (-m migration / -m live). They skip
            # without --live-url, so the job only proves they still import and
            # collect — cheap, and the alternative is finding a broken live
            # test during a release.
            ui_live:
              - 'cwa_classroom/ui_tests/live/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/ai_import/**'
              - 'cwa_classroom/brainbuzz/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/coding/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/number_puzzles/**'
              - 'cwa_classroom/quiz/**'
              - 'cwa_classroom/ui_tests/live_helpers.py'
            ui_maths:
              - 'cwa_classroom/ui_tests/maths/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/templates/maths/**'
              # The interactive question types are exercised through the homework
              # take page, so its partials decide whether a maths widget renders
              # at all — a change there can break every test in this group
              # without touching templates/maths/.
              - 'cwa_classroom/templates/homework/**'
            # The sidebars link into every subject app, so a change to any of
            # them can break a nav test. Broad on purpose.
            ui_navigation:
              - 'cwa_classroom/ui_tests/navigation/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/rewards/**'
              - 'cwa_classroom/ai_import/**'
              - 'cwa_classroom/billing/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/coding/**'
              - 'cwa_classroom/help/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/music/**'
              - 'cwa_classroom/number_puzzles/**'
              - 'cwa_classroom/quiz/**'
              - 'cwa_classroom/science/**'
              - 'cwa_classroom/worksheets/**'
              - 'cwa_classroom/templates/accounts/**'
              - 'cwa_classroom/templates/hub/**'
              - 'cwa_classroom/templates/registration/**'
            ui_parent:
              - 'cwa_classroom/ui_tests/parent/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/number_puzzles/**'
              - 'cwa_classroom/templates/parent/**'
            ui_progress:
              - 'cwa_classroom/ui_tests/progress/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/progress/**'
              - 'cwa_classroom/worksheets/**'
              - 'cwa_classroom/templates/progress/**'
            ui_quiz:
              - 'cwa_classroom/ui_tests/quiz/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/quiz/**'
              - 'cwa_classroom/templates/quiz/**'
              - 'cwa_classroom/templates/base_quiz.html'
            # Question/content import: /upload-questions/ (classroom views),
            # the PDF import pipeline (ai_import), and the homework + worksheet
            # upload forms that share the page-range field.
            ui_uploads:
              - 'cwa_classroom/ui_tests/uploads/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/ai_import/**'
              - 'cwa_classroom/billing/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/homework/**'
              - 'cwa_classroom/quiz/**'
              - 'cwa_classroom/worksheets/**'
              # "Preview as student" on the review page builds a maths.Question
              # and renders the student take partial, so a change to either
              # breaks the upload screens without touching an upload app.
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/templates/homework/**'
              - 'cwa_classroom/templates/ai_import/**'
              - 'cwa_classroom/templates/_partials/**'
              - 'cwa_classroom/ui_tests/xls_fixtures.py'
            ui_worksheets:
              - 'cwa_classroom/ui_tests/worksheets/**'
              - 'cwa_classroom/accounts/**'
              - 'cwa_classroom/billing/**'
              - 'cwa_classroom/classroom/**'
              - 'cwa_classroom/maths/**'
              - 'cwa_classroom/taskqueue/**'
              - 'cwa_classroom/worksheets/**'
              - 'cwa_classroom/templates/worksheets/**'
              # The session page renders the shared maths widgets (the table of
              # values, the fill-in-the-blank sentence) and the partial-credit
              # feedback block, so a change there breaks a worksheet test
              # without touching templates/worksheets/.
              - 'cwa_classroom/templates/maths/**'

  # Always runs — missing/conflicting migrations must never slip through, and the
  # check is cheap. Not gated on `changes`.
  migration-check:
    name: Migration Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Check for migration conflicts and missing migrations
        working-directory: cwa_classroom
        run: pytest tests_migrations.py -v --tb=short

      # Runs here because this job is the only one that is never path-gated.
      # An invalid workflow file does not go red — GitHub kills the run in zero
      # seconds and PRs show no checks at all — so it has to be caught by a
      # test rather than by noticing the absence of one.
      - name: Validate the GitHub Actions workflow files
        working-directory: cwa_classroom
        run: pytest tests_workflows.py -v --tb=short

  # A release PR (test -> main) merges `test` into `main` unchanged, so its tree
  # is byte-identical to the one the full matrix just ran on `test`. Re-running
  # every suite over it proved nothing and cost a second full matrix per
  # release — which is how the Actions spending limit was reached mid-release.
  #
  # It is NOT simply skipped: a PR showing no checks at all is how a dead CI
  # went unnoticed here for four days. This asserts the claim the skip relies
  # on — that this exact commit already passed CI on `test`.
  release-already-tested:
    name: Release tree already tested on test
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      # v8+ runs on Node 24. v7 is a Node 20 action, and the runners now warn
      # that Node 20 is deprecated — a warning on every release PR would teach
      # people to ignore this job's output, which is the one thing it exists to
      # be read for.
      - uses: actions/github-script@v8
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'test',
              head_sha: sha,
              event: 'push',
            });
            const found = runs.data.workflow_runs;
            const passed = found.find(r => r.conclusion === 'success');
            if (passed) {
              core.info(`CI run #${passed.run_number} passed on test for ${sha}`);
              core.info(passed.html_url);
              return;
            }
            const running = found.find(r => r.status !== 'completed');
            if (running) {
              // Name the run rather than showing a bare red tick — nothing is
              // wrong, it simply has not finished, and re-running THIS job is
              // the fix.
              core.setFailed(
                `CI on test is still running for ${sha} ` +
                `(run #${running.run_number}: ${running.html_url}). ` +
                `Re-run this check once it finishes.`);
              return;
            }
            core.setFailed(
              `No successful CI run on test for ${sha}. ` +
              `This tree has not been validated — do not merge to main.`);

  classroom-tests:
    name: Classroom Tests
    needs: changes
    if: ${{ needs.changes.outputs.release != 'true' && (github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.classroom == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run classroom tests
        working-directory: cwa_classroom
        run: pytest classroom/ -n auto --dist=loadscope -v --tb=short

  maths-tests:
    name: Maths Tests
    needs: changes
    if: ${{ needs.changes.outputs.release != 'true' && (github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.maths == 'true') }}
