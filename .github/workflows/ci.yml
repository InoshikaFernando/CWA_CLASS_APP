name: CI — Tests

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_ENGINE: sqlite

jobs:
  # Work out which areas a PR actually touched so we only run the relevant app
  # suites instead of all ~20 every time (each job is a fresh runner + full pip
  # install, so running the whole matrix on a one-app change burns Actions
  # minutes for nothing). SAFETY NET: a push to main/test (i.e. a merge / release)
  # ignores the filter and runs EVERY suite, so the promotion gate is always the
  # full test matrix; only PR validation is narrowed. `shared` (project package,
  # requirements, conftest, this workflow) forces the whole matrix even on a PR.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      classroom: ${{ steps.filter.outputs.classroom }}
      maths: ${{ steps.filter.outputs.maths }}
      quiz: ${{ steps.filter.outputs.quiz }}
      puzzles: ${{ steps.filter.outputs.puzzles }}
      coding: ${{ steps.filter.outputs.coding }}
      accounts: ${{ steps.filter.outputs.accounts }}
      audit: ${{ steps.filter.outputs.audit }}
      billing: ${{ steps.filter.outputs.billing }}
      homework: ${{ steps.filter.outputs.homework }}
      brainbuzz: ${{ steps.filter.outputs.brainbuzz }}
      ai_import: ${{ steps.filter.outputs.ai_import }}
      worksheets: ${{ steps.filter.outputs.worksheets }}
      taskqueue: ${{ steps.filter.outputs.taskqueue }}
      feedback: ${{ steps.filter.outputs.feedback }}
      sprints: ${{ steps.filter.outputs.sprints }}
      whatsapp: ${{ steps.filter.outputs.whatsapp }}
      ops: ${{ steps.filter.outputs.ops }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'cwa_classroom/requirements-test.txt'
              - 'cwa_classroom/requirements.txt'
              - 'cwa_classroom/cwa_classroom/**'
              - 'cwa_classroom/conftest.py'
              - 'cwa_classroom/pytest.ini'
              - 'cwa_classroom/manage.py'
              - '.github/workflows/ci.yml'
            classroom:
              - 'cwa_classroom/classroom/**'
            maths:
              - 'cwa_classroom/maths/**'
            quiz:
              - 'cwa_classroom/quiz/**'
            puzzles:
              - 'cwa_classroom/number_puzzles/**'
            coding:
              - 'cwa_classroom/coding/**'
            accounts:
              - 'cwa_classroom/accounts/**'
            audit:
              - 'cwa_classroom/audit/**'
            billing:
              - 'cwa_classroom/billing/**'
            homework:
              - 'cwa_classroom/homework/**'
            brainbuzz:
              - 'cwa_classroom/brainbuzz/**'
            ai_import:
              - 'cwa_classroom/ai_import/**'
            worksheets:
              - 'cwa_classroom/worksheets/**'
            taskqueue:
              - 'cwa_classroom/taskqueue/**'
            feedback:
              - 'cwa_classroom/feedback/**'
            sprints:
              - 'cwa_classroom/sprints/**'
            whatsapp:
              - 'cwa_classroom/whatsapp/**'
            ops:
              - 'cwa_classroom/ops/**'
            ui:
              - 'cwa_classroom/ui_tests/**'
              - 'cwa_classroom/templates/**'
              - 'cwa_classroom/**/templates/**'
              - 'cwa_classroom/static/**'
              - 'cwa_classroom/**/static/**'
              - 'cwa_classroom/brainbuzz/tests/test_student_playwright_mobile.py'

  # Always runs — missing/conflicting migrations must never slip through, and the
  # check is cheap. Not gated on `changes`.
  migration-check:
    name: Migration Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Check for migration conflicts and missing migrations
        working-directory: cwa_classroom
        run: pytest tests_migrations.py -v --tb=short

      # Runs here because this job is the only one that is never path-gated.
      # An invalid workflow file does not go red — GitHub kills the run in zero
      # seconds and PRs show no checks at all — so it has to be caught by a
      # test rather than by noticing the absence of one.
      - name: Validate the GitHub Actions workflow files
        working-directory: cwa_classroom
        run: pytest tests_workflows.py -v --tb=short

  classroom-tests:
    name: Classroom Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.classroom == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run classroom tests
        working-directory: cwa_classroom
        run: pytest classroom/tests/ -n auto --dist=loadscope -v --tb=short

  maths-tests:
    name: Maths Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.maths == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run maths tests
        working-directory: cwa_classroom
        run: pytest maths/tests/ -n auto --dist=loadscope -v --tb=short

  quiz-tests:
    name: Quiz Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.quiz == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run quiz tests
        working-directory: cwa_classroom
        run: pytest quiz/tests.py quiz/test_cpp377_recording.py quiz/test_verify_quiz_grading.py quiz/test_create_sweep_account.py -n auto --dist=loadscope -v --tb=short

  puzzles-tests:
    name: Number Puzzles Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.puzzles == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run number puzzles tests
        working-directory: cwa_classroom
        run: pytest number_puzzles/tests/ -n auto --dist=loadscope -v --tb=short

  coding-tests:
    name: Coding Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.coding == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run coding tests
        working-directory: cwa_classroom
        run: pytest coding/tests/ -n auto --dist=loadscope -v --tb=short

  accounts-tests:
    name: Accounts Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.accounts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run accounts tests
        working-directory: cwa_classroom
        run: pytest accounts/tests.py -n auto --dist=loadscope -v --tb=short

  health-tests:
    name: Health Check Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run health check tests
        working-directory: cwa_classroom
        run: pytest cwa_classroom/tests.py -n auto --dist=loadscope -v --tb=short

  audit-tests:
    name: Audit Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.audit == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run audit tests
        working-directory: cwa_classroom
        run: pytest audit/tests.py -n auto --dist=loadscope -v --tb=short

  billing-tests:
    name: Billing Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.billing == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run billing tests
        working-directory: cwa_classroom
        run: pytest billing/tests.py billing/tests_admin.py billing/tests_finance.py billing/tests_gaps.py billing/tests_parent_invoice_payment.py billing/tests_stripe.py billing/tests_views_coverage.py billing/tests_webhook_handlers.py billing/tests_ai_vendor_costs.py -n auto --dist=loadscope -v --tb=short

  homework-tests:
    name: Homework Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.homework == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run homework tests
        working-directory: cwa_classroom
        # Two invocations on purpose. homework/tests.py holds the legacy suite;
        # the app-root test_*.py files (PDF-import wiring, second-opinion
        # verification, etc.) live beside it. Passing BOTH to one pytest run
        # (`pytest homework/tests.py homework/`) silently collects only
        # homework/tests.py — pytest drops the directory argument once a module
        # inside that package has been collected, so 140 tests never ran. Two
        # runs each collect in full, and `set -e` still fails the job on either.
        run: |
          pytest homework/tests.py -n auto --dist=loadscope -v --tb=short
          pytest homework/ -n auto --dist=loadscope -v --tb=short

  brainbuzz-tests:
    name: BrainBuzz Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.brainbuzz == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run brainbuzz tests
        working-directory: cwa_classroom
        run: pytest brainbuzz/tests/ --ignore=brainbuzz/tests/test_student_playwright_mobile.py -n auto --dist=loadscope -v --tb=short

  ai-import-tests:
    name: AI Import Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.ai_import == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run AI import tests
        working-directory: cwa_classroom
        run: pytest ai_import/tests/ -n auto --dist=loadscope -v --tb=short

  worksheets-tests:
    name: Worksheets Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.worksheets == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run worksheets tests
        working-directory: cwa_classroom
        run: pytest worksheets/tests/ -n auto --dist=loadscope -v --tb=short

  taskqueue-tests:
    name: Taskqueue Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.taskqueue == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run taskqueue tests
        working-directory: cwa_classroom
        run: pytest taskqueue/tests/ -n auto --dist=loadscope -v --tb=short

  feedback-tests:
    name: Feedback Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.feedback == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run feedback tests
        working-directory: cwa_classroom
        run: pytest feedback/tests/ -n auto --dist=loadscope -v --tb=short

  sprints-tests:
    name: Sprints Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.sprints == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run sprints tests
        working-directory: cwa_classroom
        run: pytest sprints/tests/ -n auto --dist=loadscope -v --tb=short

  whatsapp-tests:
    name: WhatsApp Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.whatsapp == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run whatsapp tests
        working-directory: cwa_classroom
        run: pytest whatsapp/tests/ -n auto --dist=loadscope -v --tb=short

  ops-tests:
    name: Ops Tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.ops == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Run ops tests
        working-directory: cwa_classroom
        run: pytest ops/tests.py -n auto --dist=loadscope -v --tb=short

  ui-tests:
    name: UI Tests (Playwright)
    # UI is by far the most expensive job (~33 min vs ~1 min for most suites) and,
    # being end-to-end (templates + views + static across many apps), it can't be
    # path-filtered cleanly. So instead of picking WHICH UI tests by changed files:
    #   - every PR runs only the core-journey `-m smoke` subset (~a few min) —
    #     enough to catch a broken login / dashboard / homework-load / worksheet /
    #     upload on any change, including a pure-Python view change; and
    #   - the push to `test` runs the FULL UI suite (the real pre-production gate);
    #   - the push to `main` runs NOTHING here — that tree already passed the full
    #     suite on `test`, so re-running ~33 min on main is pure waste.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/test') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwa_classroom/requirements-test.txt

      - name: Install dependencies
        run: pip install -r cwa_classroom/requirements-test.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('cwa_classroom/requirements-test.txt') }}

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run UI tests
        working-directory: cwa_classroom
        # PRs run only the core-journey `-m smoke` subset (fast); the push to
        # `test` runs the full suite. --reruns retries ONLY the known SQLite
        # "database is locked" flake from parallel Playwright workers (see
        # cwa_classroom/conftest.py); scoped via --only-rerun so genuine assertion
        # failures still fail on the first run.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR → core-journey smoke subset only (-m smoke)"
            SELECT="-m smoke"
          else
            echo "Push to test → full UI suite"
            SELECT=""
          fi
          pytest ui_tests/ brainbuzz/tests/test_student_playwright_mobile.py $SELECT -n auto -v --tb=short --reruns 2 --only-rerun "database is locked"
