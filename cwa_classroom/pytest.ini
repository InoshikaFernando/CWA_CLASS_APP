[pytest]
DJANGO_SETTINGS_MODULE = cwa_classroom.settings
pythonpath = .
testpaths = ui_tests api/tests classroom/tests progress/tests maths/tests worksheets/tests quiz/tests.py quiz/test_cpp377_recording.py quiz/test_short_answer_grading.py quiz/test_verify_quiz_grading.py quiz/test_pattern_quiz.py quiz/test_partial_credit_quiz.py quiz/test_ungradable_hidden.py quiz/test_ai_graded_quiz.py quiz/test_create_sweep_account.py billing/tests_ai_vendor_costs.py number_puzzles/tests coding/tests brainbuzz/tests rewards/tests feedback/tests sprints/tests whatsapp/tests
addopts = -n auto
# pytest's default (test_*.py, *_test.py) matches NEITHER `tests.py` nor
# `tests_admin.py`, so `pytest billing/` used to collect zero tests and every
# job had to name its files one by one — a list that silently went stale (nine
# billing suites, plus all of notifications/ and usage/, had stopped running).
# Matching tests*.py lets a job point at an app directory and pick up whatever
# is in it, including files added later.
python_files = test_*.py tests.py tests_*.py *_test.py
markers =
    smoke: core user-journey UI tests — a quick local sanity subset (CI runs the affected ui_tests/<group>/ packages in full instead)
    sidebar: sidebar navigation tests
    dashboard: dashboard/hub page tests
    quiz: quiz experience tests
    attendance: attendance feature tests
    progress: progress dashboard tests
    progress_reports: weekly/monthly/term period report tests (CPP-388)
    messaging: Messaging Centre tests (CPP-348)
    csv_import: CSV upload/import tests
    invoice: invoicing feature tests
    parent_approval: parent signup and approval workflow tests
    parent_progress: parent progress view tests
    enrollment: enrollment request and approval workflow tests
    student_move: move-student-between-classes tests (retains old homework)
    student_edit: student edit modal tests
    parent_page: parent list page tests
    parent_invoice: parent invoice view tests
    search: server-side search tests
    parent_portal: parent portal tests
    live: browser-only tests against a deployed environment (--live-url)
    migration: migration validation tests against a deployed environment (--live-url)
    brainbuzz_images: BrainBuzz question and answer image rendering tests (CPP-250)
    brainbuzz_timeout_reveal: BrainBuzz timeout/reveal pacing tests (CPP-267)
    brainbuzz_mobile: BrainBuzz student flow on a phone viewport (CPP-237)
    makeup_attendance: make-up class attendance tests
    parent_homework: parent-facing homework view tests
    parent_invoice_payment: parent invoice payment tests
    parent_switcher: parent child-switcher tests
    reports: student/class report page tests
    cpp249: CPP-249 inline parent/student linking tests
    cpp305: CPP-305 teacher password reset tests
    subscribed_filter: "subscribed students only" filter tests
