        description: A search term.
        schema:
          type: string
      - in: query
        name: student
        schema:
          type: integer
        description: Filter to one student id.
      - in: query
        name: subtopic
        schema:
          type: string
        description: e.g. Addition.
      tags:
      - basic-facts-results
      security:
