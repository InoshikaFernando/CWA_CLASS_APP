openapi: 3.0.3
info:
  title: CWA Classroom API
  version: 1.20.0
  description: |-
    JSON API for the Wizards Learning Hub mobile app.

    All endpoints are role-scoped: a student sees only their own data, a parent only their linked children, a teacher only the classes they teach, and institute staff only their own school.
paths:
  /api/v1/attendance/:
    get:
      operationId: attendance_list
      description: Attendance records for students the caller may read.
      parameters:
      - in: query
        name: classroom
        schema:
          type: integer
        description: Filter to one class id.
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: student
        schema:
          type: integer
        description: Filter to one student id.
      tags:
      - attendance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudentAttendanceList'
          description: ''
  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: |-
        Change the caller's own password.

        Also clears ``must_change_password``, which is the flag that walls a
        newly-created account behind the profile gate — so a student created by a
        head of institute can complete that step from the app instead of being
        told to go and find a browser.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Password changed.
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        POST username/email + password → access and refresh tokens.

        The username field accepts an email too: the project authenticates through
        ``accounts.backends.EmailOrUsernameBackend``, and a student who signs in to
        the website with their email would otherwise be told their password was
        wrong on the phone.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Revoke a refresh token.

        Without this, "log out" on a phone can only forget the tokens locally —
        a copy taken off the device would keep working until it expired, which
        with a 30-day refresh lifetime is a long time to be wrong about.

        The access token is not revoked (it is stateless and short-lived by
        design); the client discards it and it dies on its own.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '205':
          description: Refresh token revoked.
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        The signed-in user's own profile.

        GET returns it; PATCH updates the handful of fields a person owns about
        themselves. Roles, school membership and account standing are deliberately
        not writable — those are granted by a school, not chosen by the holder.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: |-
        The signed-in user's own profile.

        GET returns it; PATCH updates the handful of fields a person owns about
        themselves. Roles, school membership and account standing are deliberately
        not writable — those are granted by a school, not chosen by the holder.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Exchange a refresh token for a new access token.

        Rotation is on, so the response also carries a NEW refresh token and the
        one just used is blacklisted. The client must store the returned refresh
        token — replaying the old one will be rejected.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/verify/:
    post:
      operationId: auth_verify_create
      description: Cheap "is this token still good?" check for app start-up.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
