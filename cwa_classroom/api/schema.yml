components:
  schemas:
    AttendanceMarkRequest:
      type: object
      description: Payload for a teacher marking one student present/absent/late.
      properties:
        student_id:
          type: integer
        status:
          $ref: '#/components/schemas/AttendanceMarkStatusEnum'
      required:
      - status
      - student_id
    AttendanceMarkStatusEnum:
      enum:
      - present
      - absent
      - late
      type: string
      description: |-
        * `present` - present
        * `absent` - absent
        * `late` - late
    AttendanceStatusEnum:
      enum:
      - present
      - absent
      - late
      type: string
      description: |-
        * `present` - Present
        * `absent` - Absent
        * `late` - Late
    BasicFactsResult:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student_id:
          type: integer
          readOnly: true
        level_id:
          type: integer
          nullable: true
          readOnly: true
        level_name:
          type: string
          readOnly: true
        subtopic:
          type: string
          description: e.g. Addition, Subtraction, Multiplication, Division, PlaceValue
          maxLength: 20
        level_number:
          type: integer
          nullable: true
          description: Numeric level within the subtopic (1-10)
        score:
          type: integer
          description: Number of correct answers
        total_points:
          type: integer
          description: Total possible points
        points:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Calculated points based on score, time, and percentage
        time_taken_seconds:
          type: integer
          description: Time taken for this attempt in seconds
        completed_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - completed_at
      - id
      - level_id
      - level_name
      - points
      - score
      - student_id
      - time_taken_seconds
      - total_points
    BlankEnum:
      enum:
      - ''
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - current_password
      - new_password
    Child:
      type: object
      description: A parent's linked child, as the parent's app lists them.
      properties:
        id:
          type: integer
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        relationship:
          oneOf:
          - $ref: '#/components/schemas/RelationshipEnum'
          - $ref: '#/components/schemas/BlankEnum'
        is_primary_contact:
          type: boolean
      required:
      - id
      - student
    ClassRoom:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        code:
          type: string
          readOnly: true
        description:
          type: string
        day:
          oneOf:
          - $ref: '#/components/schemas/DayEnum'
          - $ref: '#/components/schemas/BlankEnum'
        start_time:
          type: string
          format: time
          nullable: true
        end_time:
          type: string
          format: time
          nullable: true
        is_online:
          type: boolean
          description: Mark this class as delivered online. Combine with a location
            for hybrid (mixed) delivery.
        location_name:
          type: string
          readOnly: true
        school_name:
          type: string
          readOnly: true
        subject:
          allOf:
          - $ref: '#/components/schemas/Subject'
          readOnly: true
        teachers:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
          readOnly: true
        student_count:
          type: integer
          nullable: true
          readOnly: true
        is_active:
          type: boolean
      required:
      - code
      - id
      - location_name
      - name
      - school_name
      - student_count
      - subject
      - teachers
    ClassSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        classroom_id:
          type: integer
          readOnly: true
        classroom_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        status:
          $ref: '#/components/schemas/SessionStatusEnum'
        cancellation_reason:
          type: string
      required:
      - classroom_id
      - classroom_name
      - date
      - end_time
      - id
      - start_time
    ClassStudent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        classroom_id:
          type: integer
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
      required:
      - classroom_id
      - id
      - joined_at
      - student
    CodingExercise:
      type: object
      description: |-
        An exercise as the student opens it.

        ``solution_code`` is present in ``Meta.fields`` only so staff can read it;
        ``to_representation`` removes it for everyone else. Putting the reference
        solution on a student's device would end the exercise.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
          description: Instructions shown to the student
        starter_code:
          type: string
          description: Pre-filled code shown in the editor when the student opens
            the exercise
        expected_output:
          type: string
          description: Expected stdout for simple output-matching exercises (leave
            blank for free-form exercises)
        hints:
          type: string
          description: Optional hint text shown on request
        order:
          type: integer
        question_type:
          allOf:
          - $ref: '#/components/schemas/QuestionTypeEnum'
          description: |-
            write_code (default) keeps existing behaviour. Other types expose MCQ/TF/short-answer options via CodingAnswer and allow the exercise to be used in BrainBuzz sessions.

            * `write_code` - Write Code
            * `multiple_choice` - Multiple Choice
            * `true_false` - True / False
            * `short_answer` - Short Answer
            * `fill_blank` - Fill in the Blank
        uses_browser_sandbox:
          type: boolean
          description: Override execution environment for this exercise. When True,
            the editor renders an iframe sandbox instead of sending code to Piston.
            Use for DOM/HTML-in-JS exercises that belong to a non-browser language
            topic (e.g. JavaScript DOM Basics).
        topic_level_id:
          type: integer
          readOnly: true
        solution_code:
          type: string
          description: Reference solution — shown only to teachers, never to students
      required:
      - description
      - id
      - title
      - topic_level_id
    CodingLanguage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        slug:
          allOf:
          - $ref: '#/components/schemas/SlugEnum'
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        icon_name:
          type: string
          description: Icon identifier used in templates
          maxLength: 50
        color:
          type: string
          description: Tailwind color class, e.g. 'blue-500'
          maxLength: 30
        order:
          type: integer
        is_active:
          type: boolean
      required:
      - id
      - name
      - slug
    CodingTopic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        order:
          type: integer
        language_id:
          type: integer
          readOnly: true
        language_name:
          type: string
          readOnly: true
      required:
      - id
      - language_id
      - language_name
      - name
      - slug
    DayEnum:
      enum:
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
      - sunday
      type: string
      description: |-
        * `monday` - Monday
        * `tuesday` - Tuesday
        * `wednesday` - Wednesday
        * `thursday` - Thursday
        * `friday` - Friday
        * `saturday` - Saturday
        * `sunday` - Sunday
    FAQ:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        question:
          type: string
          maxLength: 300
        answer_markdown:
          type: string
        order:
          type: integer
      required:
      - answer_markdown
      - id
      - question
    Feedback:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          $ref: '#/components/schemas/FeedbackCategoryEnum'
        title:
          type: string
          maxLength: 200
        description:
          type: string
        page_url:
          type: string
          description: URL of the page the feedback was raised from.
          maxLength: 500
        status:
          allOf:
          - $ref: '#/components/schemas/FeedbackStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - description
      - id
      - status
    FeedbackCategoryEnum:
      enum:
      - bug
      - feature
      - improvement
      type: string
      description: |-
        * `bug` - Bug
        * `feature` - Feature request
        * `improvement` - Improvement
    FeedbackRequest:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/FeedbackCategoryEnum'
        title:
          type: string
          maxLength: 200
        description:
          type: string
          minLength: 1
        page_url:
          type: string
          description: URL of the page the feedback was raised from.
          maxLength: 500
      required:
      - category
      - description
    FeedbackStatusEnum:
      enum:
      - new
      - triaged
      - planned
      - done
      - rejected
      - duplicate
      type: string
      description: |-
        * `new` - New
        * `triaged` - Triaged
        * `planned` - Planned
        * `done` - Done
        * `rejected` - Rejected
        * `duplicate` - Duplicate
    HelpArticleDetail:
      type: object
      description: |-
        Detail adds the body.

        Markdown rather than the rendered HTML: the app styles it natively, and
        shipping server-rendered HTML into a mobile view is how a help page ends
        up looking like a web page bolted into an app.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
          maxLength: 300
        category:
          allOf:
          - $ref: '#/components/schemas/HelpCategory'
          readOnly: true
        module:
          oneOf:
          - $ref: '#/components/schemas/ModuleEnum'
          - $ref: '#/components/schemas/BlankEnum'
        is_featured:
          type: boolean
          description: Pin to top of help centre
        updated_at:
          type: string
          format: date-time
          readOnly: true
        body_markdown:
          type: string
      required:
      - body_markdown
      - category
      - id
      - slug
      - title
      - updated_at
    HelpArticleSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
          maxLength: 300
        category:
          allOf:
          - $ref: '#/components/schemas/HelpCategory'
          readOnly: true
        module:
          oneOf:
          - $ref: '#/components/schemas/ModuleEnum'
          - $ref: '#/components/schemas/BlankEnum'
        is_featured:
          type: boolean
          description: Pin to top of help centre
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - id
      - slug
      - title
      - updated_at
    HelpCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        order:
          type: integer
      required:
      - id
      - name
      - slug
    Homework:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        homework_type:
          $ref: '#/components/schemas/HomeworkTypeEnum'
        subject_slug:
          type: string
          description: Which subject-plugin owns this homework — drives topic picker,
            item rendering and grading via classroom.subject_registry.
          maxLength: 50
        classroom_id:
          type: integer
          readOnly: true
        classroom_name:
          type: string
          readOnly: true
        num_questions:
          type: integer
        due_date:
          type: string
          format: date-time
        max_attempts:
          type: integer
          nullable: true
          description: Leave blank for unlimited attempts.
        published_at:
          type: string
          format: date-time
          nullable: true
          description: Set when the homework actually went live. This is the single
            gate for student visibility and the publish notification email.
        status:
          type: string
          readOnly: true
        is_past_due:
          type: boolean
          readOnly: true
        topics:
          type: array
          items:
            type: string
          readOnly: true
        attempts_used:
          type: integer
          readOnly: true
        best_score:
          type: integer
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attempts_used
      - best_score
      - classroom_id
      - classroom_name
      - created_at
      - due_date
      - id
      - is_past_due
      - status
      - title
      - topics
    HomeworkQuestion:
      type: object
      description: |-
        One assigned item.

        ``content_id`` plus ``subject_slug`` is the real identity — a homework can
        hold maths questions, coding exercises or anything else the subject
        registry knows about, so the app resolves the body through the matching
        subject endpoint rather than expecting a maths question here.
      properties:
        id:
          type: integer
          readOnly: true
        order:
          type: integer
        subject_slug:
          type: string
          description: Binds to classroom.subject_registry plugin slug.
          maxLength: 50
        content_id:
          type: integer
          description: pk of the underlying content row (maths.Question.id, coding.CodingExercise.id,
            ...).
      required:
      - id
    HomeworkStudentAnswer:
      type: object
      description: |-
        One graded answer, as the student sees it after submitting.

        Fields are listed explicitly rather than with ``__all__``: the model also
        carries the grading internals (which teacher graded it, the AI confidence
        fraction, the raw answer_data blob), and ``__all__`` would ship every one
        of those to the phone the moment someone adds a column.
      properties:
        id:
          type: integer
          readOnly: true
        subject_slug:
          type: string
          readOnly: true
          description: Binds to classroom.subject_registry plugin slug.
        content_id:
          type: integer
          readOnly: true
          description: pk of the underlying content row (maths.Question.id, coding.CodingExercise.id,
            ...).
        text_answer:
          type: string
          readOnly: true
        is_correct:
          type: boolean
          readOnly: true
        points_earned:
          type: number
          format: double
          readOnly: true
        review_status:
          allOf:
          - $ref: '#/components/schemas/ReviewStatusEnum'
          readOnly: true
        is_pending_review:
          type: boolean
          readOnly: true
        feedback:
          type: string
          readOnly: true
      required:
      - content_id
      - feedback
      - id
      - is_correct
      - is_pending_review
      - points_earned
      - review_status
      - subject_slug
      - text_answer
    HomeworkSubmission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        homework_id:
          type: integer
          readOnly: true
        homework_title:
          type: string
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        attempt_number:
          type: integer
        score:
          type: integer
        total_questions:
          type: integer
        percentage:
          type: integer
          readOnly: true
        points:
          type: number
          format: double
        time_taken_seconds:
          type: integer
        submission_status:
          type: string
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - homework_id
      - homework_title
      - id
      - percentage
      - student
      - submission_status
      - submitted_at
    HomeworkSubmitRequest:
      type: object
      description: |-
        A completed attempt, submitted in one request.

        Deliberately one call rather than an answer-at-a-time stream: a phone on a
        school's wifi drops connections mid-quiz, and a half-recorded attempt that
        still counts against ``max_attempts`` is worse than a failed one the
        student can retry.
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/SubmittedAnswerRequest'
        time_taken_seconds:
          type: integer
          minimum: 0
          default: 0
      required:
      - answers
    HomeworkTypeEnum:
      enum:
      - topic
      - mixed
      - pdf_upload
      - json_upload
      type: string
      description: |-
        * `topic` - Topic Quiz
        * `mixed` - Mixed Quiz
        * `pdf_upload` - PDF Upload
        * `json_upload` - JSON Upload
    Invoice:
      type: object
      description: |-
        An invoice as the payer sees it.

        ``rate_source`` and ``calculated_amount`` are omitted deliberately: they
        are the school's internal pricing cascade (which fee override produced
        this rate), not something a parent is being billed for.
      properties:
        id:
          type: integer
          readOnly: true
        invoice_number:
          type: string
          maxLength: 50
        student:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        school_name:
          type: string
          readOnly: true
        billing_period_start:
          type: string
          format: date
        billing_period_end:
          type: string
          format: date
        period_type:
          $ref: '#/components/schemas/InvoicePeriodTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Final amount (may be adjusted by HoI)
        status:
          $ref: '#/components/schemas/InvoiceStatusEnum'
        issued_at:
          type: string
          format: date-time
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
        stripe_payment_link:
          type: string
          format: uri
          description: Stripe Payment Link override for this invoice. Overrides department
            and institute defaults.
          maxLength: 200
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineItem'
          readOnly: true
      required:
      - amount
      - billing_period_end
      - billing_period_start
      - id
      - invoice_number
      - line_items
      - school_name
      - student
    InvoiceLineItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        classroom_name:
          type: string
          readOnly: true
        daily_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        sessions_held:
          type: integer
        sessions_attended:
          type: integer
        sessions_charged:
          type: integer
        line_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - classroom_name
      - daily_rate
      - id
      - line_amount
      - sessions_attended
      - sessions_charged
      - sessions_held
