    StudentExerciseSubmission:
      type: object
      description: |-
        A student's attempt at an exercise.

        ``exercise`` is a real relation field, not a bare ``exercise_id``: DRF does
        not treat ``<fk>_id`` as writable, so naming it that way meant the value
        was dropped on create and the write failed with a 500 instead of a
        validation error.
      properties:
        id:
          type: integer
          readOnly: true
        exercise:
          type: integer
        code_submitted:
          type: string
        output_received:
          type: string
          description: stdout returned by the code executor
        stderr_received:
          type: string
          description: stderr returned by the code executor
        is_completed:
          type: boolean
          description: True once the student marks the exercise as done or output
            matches expected
        time_taken_seconds:
          type: integer
          description: Time spent on this submission in seconds
        submitted_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code_submitted
      - exercise
      - id
      - submitted_at
    StudentExerciseSubmissionRequest:
      type: object
      description: |-
        A student's attempt at an exercise.

        ``exercise`` is a real relation field, not a bare ``exercise_id``: DRF does
        not treat ``<fk>_id`` as writable, so naming it that way meant the value
        was dropped on create and the write failed with a 500 instead of a
        validation error.
      properties:
        exercise:
          type: integer
        code_submitted:
          type: string
          minLength: 1
        output_received:
          type: string
          description: stdout returned by the code executor
        stderr_received:
          type: string
          description: stderr returned by the code executor
        is_completed:
          type: boolean
          description: True once the student marks the exercise as done or output
            matches expected
