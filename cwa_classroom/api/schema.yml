          maxLength: 150
        full_name:
          type: string
          readOnly: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        phone:
          type: string
          maxLength: 30
        country:
          type: string
          maxLength: 100
        region:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        street_address:
          type: string
          maxLength: 255
        postal_code:
          type: string
          maxLength: 20
        roles:
