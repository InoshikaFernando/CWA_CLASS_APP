    TokenObtainPairRequest:
      type: object
      description: |-
        Login. Adds role claims, and refuses a blocked account outright.

        The account-standing middlewares cannot help here: at login the caller is
        still anonymous, so they pass the request straight through. A blocked
        account that received a working token and only discovered the block on its
        next call would have been told it logged in successfully — so the block is
        checked once, here, at the only point where it is invisible to the
        middleware.

        Subscription and profile states are deliberately NOT re-checked: login
        succeeds and the very next call hits the middleware, which answers with
        the precise coded 403 for that state. Duplicating that cascade is how the
        two copies drift.
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenVerifyRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    Topic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        order:
          type: integer
        is_active:
          type: boolean
        subject_id:
          type: integer
          readOnly: true
        parent_id:
          type: integer
          readOnly: true
        level_ids:
          type: array
          items:
            type: integer
          readOnly: true
      required:
      - id
      - level_ids
      - name
      - parent_id
      - slug
      - subject_id
